[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numguard-fin"
version = "1.0.0"
description = "Provenance-constrained numerical decoding for financial question answering"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1,<3",
  "transformers>=4.40,<5",
  "sentencepiece>=0.2,<0.3",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "openpyxl>=3.1,<4",
]

[project.scripts]
numguard-fin = "numguard_fin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
